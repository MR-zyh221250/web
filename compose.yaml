name: neon-loft
services:
  web:
    image: ${NEON_IMAGE:?Set NEON_IMAGE to the tested image tag}
    restart: unless-stopped
    ports:
      - "${NEON_BIND_ADDRESS:-0.0.0.0}:${NEON_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  crm:
    image: ${NEON_CRM_IMAGE:?Set NEON_CRM_IMAGE to the tested CRM image}
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
