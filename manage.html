<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>客户销售管理 · NEON LOFT</title></head>
<body><section id="auth-gate" class="auth-gate"><form id="login-form" class="auth-card"><a class="brand" href="/">NEON <span>LOFT</span></a><p class="eyebrow">店铺 · 广告 · 客户 · 销售</p><h1>欢迎回来</h1><p class="storage-note">使用管理员为你创建的账号登录。</p><label>账号<input name="username" required autocomplete="username" maxlength="40"></label><label>密码<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"></label><p id="login-error" role="alert"></p><button type="submit" class="primary">登录工作台</button><a class="back" href="/">独立商户与客户管理站</a></form></section><div id="workspace" class="layout" hidden><aside><a class="brand" href="/">NEON<span>LOFT</span></a><p class="caption">店铺 · 广告 · 客户 · 销售</p><nav><button data-view="customers" class="active">客户管理</button><button data-view="sales">销售记录</button><button id="users-nav" data-view="users" hidden>账号管理</button><button data-view="shops">店铺管理</button><button data-view="adverts">业务广告</button><button data-view="categories" hidden>广告分类</button><button data-view="reservations">预约与留言</button></nav><a class="back" href="/">独立商户与客户管理站</a></aside>
<main><header><div><p class="eyebrow">WORKSPACE / 工作台</p><h1>商户与客户工作台</h1></div><span id="identity" class="mode"></span></header><p class="storage-note">数据保存于服务器，按账号权限展示。</p>
<div class="account-actions"><button id="refresh">刷新数据</button><button id="change-password">修改密码</button><button id="logout" class="logout-prominent">退出登录</button></div><div class="stats" id="stats"><article><span>客户总数</span><strong id="customer-count">0</strong></article><article><span>销售笔数</span><strong id="sale-count">0</strong></article><article><span>累计销售额</span><strong id="sale-total">¥0.00</strong></article></div>
<section class="panel"><div class="toolbar"><h2 id="section-title">客户管理</h2><div><input id="search" aria-label="搜索客户或销售记录" placeholder="搜索姓名、公司、电话…"><button id="add" class="primary">新增客户</button></div></div><p id="notice" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div id="empty" class="empty">从第一位客户开始。点击“新增客户”记录联系方式。</div></section>
<footer>NEON LOFT · 每一次联系，都值得记录。 · <a href="/project-notes.txt" target="_blank" rel="noopener">项目说明</a></footer></main></div>
<dialog id="editor"><form id="record-form"><div class="dialog-head"><h2 id="dialog-title">新增客户</h2><button type="button" id="close" aria-label="关闭">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button id="save-record" type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="delete-dialog"><h2>删除记录</h2><p id="delete-prompt"></p><p id="delete-error" role="alert"></p><div class="dialog-actions"><button id="delete-cancel" type="button">取消</button><button id="delete-confirm" type="submit" class="danger">确认删除</button></div></dialog><dialog id="password-dialog"><form id="password-form"><h2>修改密码</h2><p id="password-note" class="storage-note"></p><label>原密码<input name="oldPassword" type="password" required minlength="10" maxlength="128" autocomplete="current-password"></label><label>新密码<input name="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><label>确认新密码<input name="confirmPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><p id="password-error" role="alert"></p><div class="dialog-actions"><button id="password-cancel" type="button">取消</button><button type="submit" class="primary">更新密码</button></div></form></dialog><script type="module" src="/src/admin.js"></script></body></html>
