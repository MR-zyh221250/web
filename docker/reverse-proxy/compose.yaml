name: neon-proxy
services:
  caddy:
    image: ${CADDY_IMAGE:?Set the verified Caddy image digest}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  caddy-data:
  caddy-config:
